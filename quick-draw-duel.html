<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1c0f0a">
<title>Quick Draw Duel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rye&display=swap" rel="stylesheet">
<style>
:root{
  --wood:#5a3418; --wood-dark:#3a2010; --gold:#ffcf4a; --cream:#ffeac0;
  --skin:#d9a070; --hat:#6b4423; --vest:#4a2c16; --jeans:#34456b; --boots:#2a1a10; --shirt:#d8c49a;
  --western:"Rye",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#1c0f0a;color:var(--cream);
  font-family:Georgia,"Times New Roman",serif;user-select:none;-webkit-user-select:none;
  touch-action:none;overscroll-behavior:none}

/* ---------- arena ---------- */
#arena{position:fixed;inset:0;display:flex;flex-direction:column;gap:8px;background:
  repeating-linear-gradient(90deg,var(--wood) 0 14px,var(--wood-dark) 14px 16px)}
.half{flex:1;position:relative;overflow:hidden;cursor:pointer;min-height:0}
#h1{transform:rotate(180deg);
  --sky1:#1f0c2b;--sky2:#8f2f2a;--sky3:#f39445;--far:#6b2a22;--near:#3d1c12;--ground:#2c150c;--band:#d63a2a;--accent:#ff8a6a}
#h2{
  --sky1:#0d1433;--sky2:#3a4c8c;--sky3:#eaa55e;--far:#3a3456;--near:#2a2033;--ground:#211714;--band:#2f86e0;--accent:#8fc3ff}
@media (orientation:landscape){
  #arena{flex-direction:row;background:repeating-linear-gradient(0deg,var(--wood) 0 14px,var(--wood-dark) 14px 16px)}
  #h1{transform:none}
  #h2 .cowboy{transform:scaleX(-1)}
}

/* scene */
.scene{position:absolute;inset:0;background:linear-gradient(to bottom,var(--sky1) 0%,var(--sky2) 45%,var(--sky3) 72%);
  transition:filter .3s}
.sun{position:absolute;left:68%;top:48%;width:min(26vmin,140px);aspect-ratio:1;border-radius:50%;
  transform:translate(-50%,-50%);background:radial-gradient(circle,#fff3c4 0%,#ffd06a 45%,#ff9a3c 70%,transparent 72%);
  box-shadow:0 0 60px 20px rgba(255,170,80,.35)}
.land{position:absolute;left:0;bottom:0;width:100%;height:58%}
.half.win .scene::after{content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 50% 70%,rgba(255,207,74,.45),transparent 60%);animation:glow 1.2s ease-out}
.half.lose .scene{filter:grayscale(.75) brightness(.55)}
body.draw .scene{filter:brightness(1.25) saturate(1.3)}
@keyframes glow{from{opacity:0}to{opacity:1}}

/* content */
.content{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;
  padding:12px 16px 0;text-align:center}
.top{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px}
.name{font-family:var(--western);font-size:clamp(.95rem,3.6vmin,1.4rem);color:var(--accent);
  text-shadow:0 2px 0 rgba(0,0,0,.5);letter-spacing:.04em}
.bullets{display:flex;gap:5px}
.b{width:9px;height:20px;border-radius:5px 5px 2px 2px;border:2px solid rgba(255,234,192,.7);background:rgba(0,0,0,.25)}
.b.on{background:linear-gradient(#ffe38a,#c9901d);border-color:#ffe38a;box-shadow:0 0 6px #ffcf4a}
.msg{font-family:var(--western);font-size:clamp(2rem,10vmin,5.2rem);line-height:1.05;margin-top:2vmin;
  color:var(--cream);text-shadow:0 4px 0 rgba(0,0,0,.45),0 0 18px rgba(0,0,0,.35);min-height:1.05em}
.sub{font-size:clamp(.85rem,3.4vmin,1.25rem);min-height:1.4em;opacity:.92;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.stage{flex:1;min-height:0;width:100%;display:flex;align-items:flex-end;justify-content:center;padding-bottom:3%}
.hint{position:absolute;z-index:1;right:12px;bottom:8px;font-size:.75rem;opacity:.55;letter-spacing:.08em}
body.draw .msg{color:var(--gold);animation:pop .2s ease-out}
.half.win .msg{color:var(--gold)}
@keyframes pop{from{transform:scale(1.6)}to{transform:scale(1)}}

/* ---------- cowboy ---------- */
.cowboy{height:100%;max-height:300px;width:auto;overflow:visible;filter:drop-shadow(0 4px 4px rgba(0,0,0,.4))}
.cowboy *{transform-box:view-box}
.cowboy .body{transform-origin:58px 208px;animation:breathe 3s ease-in-out infinite}
.cowboy .arm{transform-origin:72px 92px}
.cowboy .hat{transform-origin:61px 55px}
.cowboy .mflash{opacity:0;transform-origin:72px 162px}
.cowboy .smoke circle{opacity:0}
@keyframes breathe{50%{transform:translateY(1.2px)}}

.half.wait .arm{animation:twitch 1.4s ease-in-out infinite}
body.draw .half .arm{animation:twitch .25s ease-in-out infinite}
@keyframes twitch{0%,100%{transform:rotate(0)}50%{transform:rotate(-7deg)}}

.half.win .arm{animation:drawGun .55s ease-out forwards}
@keyframes drawGun{0%{transform:rotate(0)}35%{transform:rotate(-96deg)}52%{transform:rotate(-114deg)}75%,100%{transform:rotate(-90deg)}}
.half.win .mflash{animation:muzzle .32s .16s ease-out}
@keyframes muzzle{0%{opacity:0;transform:scale(.3)}30%{opacity:1;transform:scale(1.25)}100%{opacity:0;transform:scale(1.7)}}
.half.win .smoke circle{animation:smoke 1.6s ease-out forwards}
.half.win .smoke circle:nth-child(1){animation-delay:.25s}
.half.win .smoke circle:nth-child(2){animation-delay:.38s}
.half.win .smoke circle:nth-child(3){animation-delay:.5s}
@keyframes smoke{0%{opacity:.85;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(14px,-38px) scale(2.2)}}
.cowboy .smoke circle{transform-box:fill-box;transform-origin:center}
.half.win .hat{animation:tip .7s 1.25s ease-in-out}
@keyframes tip{50%{transform:translateY(-7px) rotate(-16deg)}}

.half.lose .body{animation:fall .75s .18s cubic-bezier(.5,0,.9,.6) forwards}
@keyframes fall{0%{transform:rotate(0)}22%{transform:rotate(7deg)}100%{transform:rotate(-84deg)}}
.half.lose .hat{animation:hatfly 1.1s .18s ease-out forwards}
@keyframes hatfly{40%{transform:translate(-8px,-46px) rotate(-70deg)}100%{transform:translate(-26px,-14px) rotate(-170deg)}}

/* ---------- draw flash + medallion ---------- */
#flash{position:fixed;inset:0;background:#fff8e0;opacity:0;pointer-events:none;z-index:3}
#flash.go{animation:flash .35s ease-out}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
#mid{position:fixed;left:50%;top:50%;width:64px;height:64px;transform:translate(-50%,-50%);z-index:2;pointer-events:none;
  filter:drop-shadow(0 3px 4px rgba(0,0,0,.6))}
#mid text{font-family:var(--western);font-size:15px;fill:#3a2010}

/* ---------- menu (wanted poster) ---------- */
#menu{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:16px;
  background:radial-gradient(circle at 50% 40%,rgba(90,52,24,.85),rgba(20,10,6,.97))}
#menu.hidden{display:none}
.poster{width:100%;max-width:370px;max-height:100%;overflow:auto;text-align:center;display:flex;flex-direction:column;gap:.85rem;
  padding:22px 22px 18px;color:#3a2010;border-radius:6px;transform:rotate(-1deg);
  background:radial-gradient(circle at 30% 20%,#f7e6bd,#e6c98e 70%,#cfa865);
  box-shadow:0 18px 40px rgba(0,0,0,.6),inset 0 0 40px rgba(120,70,20,.35)}
.poster .wanted{font-family:var(--western);font-size:clamp(2.4rem,12vw,3.4rem);line-height:.9;letter-spacing:.04em}
.poster .title{font-family:var(--western);font-size:clamp(1.15rem,5vw,1.5rem);border-top:2px solid #3a2010;border-bottom:2px solid #3a2010;padding:.3rem 0}
.poster svg{height:90px;margin:0 auto;overflow:visible}
.poster p{line-height:1.35;font-size:.98rem}
.btn{font-family:var(--western);font-size:1.15rem;padding:.75rem 1rem;border-radius:8px;border:3px solid #3a2010;
  background:transparent;color:#3a2010;cursor:pointer}
.btn.primary{background:#3a2010;color:var(--cream)}
.row{display:flex;gap:.5rem;justify-content:center;align-items:center;flex-wrap:wrap}
.seg{font-family:var(--western);padding:.3rem .85rem;border-radius:6px;border:2px solid #3a2010;background:transparent;color:#3a2010;cursor:pointer}
.seg.on{background:#3a2010;color:var(--cream)}
.small{font-size:.8rem;opacity:.75}
</style>
</head>
<body>
<div id="arena">
  <div class="half" id="h1"></div>
  <div class="half" id="h2"></div>
</div>
<div id="flash"></div>
<svg id="mid" viewBox="0 0 64 64">
  <polygon points="32,2 39,22 61,22 43,35 50,57 32,44 14,57 21,35 3,22 25,22" fill="#ffcf4a" stroke="#8a5a14" stroke-width="2"/>
  <circle cx="32" cy="32" r="12" fill="#ffe08a" stroke="#8a5a14" stroke-width="1.5"/>
  <text id="roundTxt" x="32" y="37" text-anchor="middle">1</text>
</svg>

<div id="menu">
  <div class="poster">
    <div class="wanted">WANTED</div>
    <div class="title">Fastest Gun in the West</div>
    <svg viewBox="0 0 170 220" id="posterCowboy"></svg>
    <p>Wait for <b>DRAW!</b> then tap your side first.<br>Fire early and you lose the round.</p>
    <div class="row"><span style="font-family:var(--western)">First to</span>
      <button class="seg" data-t="1">1</button>
      <button class="seg on" data-t="3">3</button>
      <button class="seg" data-t="5">5</button>
    </div>
    <button class="btn primary" id="b2p">2 Players</button>
    <button class="btn" id="bcpu">vs Computer</button>
    <button class="btn" id="bfs">Fullscreen</button>
    <div class="small" id="best"></div>
    <div class="small">Keyboard: Player 1 = A · Player 2 = L · vs Computer = Space</div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

/* ---------- artwork ---------- */
const COWBOY = `
  <ellipse cx="60" cy="211" rx="40" ry="6" fill="rgba(0,0,0,.35)"/>
  <g class="body">
    <rect x="41" y="88" width="9" height="40" rx="4.5" fill="#b8a47c"/>
    <circle cx="45.5" cy="131" r="5" fill="var(--skin)"/>
    <path d="M49 139 L47 204 L58 204 L61 152 L64 204 L75 204 L73 139Z" fill="var(--jeans)"/>
    <rect x="43" y="200" width="16" height="10" rx="2" fill="var(--boots)"/>
    <rect x="63" y="200" width="18" height="10" rx="2" fill="var(--boots)"/>
    <path d="M46 88 Q61 80 76 88 L74 141 L48 141Z" fill="var(--shirt)"/>
    <path d="M46 88 L56 86 L58 141 L48 141Z" fill="var(--vest)"/>
    <path d="M76 88 L66 86 L64 141 L74 141Z" fill="var(--vest)"/>
    <circle cx="70" cy="104" r="3" fill="#ffcf4a"/>
    <rect x="47" y="132" width="28" height="7" fill="#2a1a10"/>
    <rect x="57" y="132.5" width="8" height="6" rx="1" fill="#e0b040"/>
    <rect x="70" y="137" width="9" height="16" rx="2" fill="#5a3214"/>
    <polygon points="52,79 70,79 61,93" fill="var(--band)"/>
    <circle cx="61" cy="68" r="13" fill="var(--skin)"/>
    <circle cx="73" cy="69.5" r="2.6" fill="var(--skin)"/>
    <circle cx="67.5" cy="66" r="1.5" fill="#2a1a10"/>
    <path d="M61 74.5 q5.5 4 11.5 0 q-5.5 2 -11.5 0z" fill="#3a2414"/>
    <g class="hat">
      <ellipse cx="61" cy="57" rx="26" ry="4.8" fill="var(--hat)"/>
      <path d="M47 57 Q46 38 54 36.5 Q61 41 68 36.5 Q76 38 75 57Z" fill="var(--hat)"/>
      <rect x="47.5" y="51" width="27" height="4" fill="#2a1a10"/>
    </g>
    <g class="arm">
      <rect x="73" y="124" width="6" height="10" rx="2" fill="#6b3d1f"/>
      <rect x="67" y="88" width="10" height="40" rx="5" fill="var(--shirt)"/>
      <rect x="68" y="133" width="8" height="8" rx="2" fill="#5f5f68"/>
      <rect x="69.5" y="134" width="5" height="23" rx="1.5" fill="#3a3a42"/>
      <circle cx="72" cy="131" r="5.5" fill="var(--skin)"/>
      <polygon class="mflash" points="72,158 76,166 84,163 78,170 85,177 75,174 72,184 69,174 59,177 66,170 60,163 68,166" fill="#ffe27a" stroke="#ff8a2a" stroke-width="1.5"/>
    </g>
  </g>
  <g class="smoke">
    <circle cx="146" cy="90" r="6" fill="#e9e1d4"/>
    <circle cx="152" cy="86" r="5" fill="#ddd4c6"/>
    <circle cx="142" cy="84" r="4.5" fill="#f2ece2"/>
  </g>`;

const LAND = `
  <svg class="land" viewBox="0 0 400 160" preserveAspectRatio="xMidYMax slice">
    <path d="M0 92 L38 92 L48 70 L108 70 L117 92 L188 94 L199 58 L252 58 L263 94 L328 92 L339 76 L380 76 L389 92 L400 92 L400 160 L0 160Z" fill="var(--far)"/>
    <path d="M0 112 Q90 98 200 108 T400 104 L400 160 L0 160Z" fill="var(--near)"/>
    <path d="M0 128 Q120 118 230 126 T400 122 L400 160 L0 160Z" fill="var(--ground)"/>
    <g fill="var(--near)">
      <rect x="330" y="66" width="10" height="44" rx="5"/>
      <rect x="318" y="78" width="8" height="20" rx="4"/><rect x="318" y="92" width="14" height="6" rx="3"/>
      <rect x="344" y="72" width="8" height="18" rx="4"/><rect x="338" y="84" width="14" height="6" rx="3"/>
      <rect x="34" y="90" width="7" height="24" rx="3.5"/><rect x="26" y="96" width="6" height="12" rx="3"/><rect x="26" y="104" width="10" height="4" rx="2"/>
    </g>
  </svg>`;

function buildHalf(el){
  el.innerHTML = `
    <div class="scene"><div class="sun"></div>${LAND}</div>
    <div class="content">
      <div class="top"><span class="name"></span><span class="bullets"></span></div>
      <div class="msg"></div>
      <div class="sub"></div>
      <div class="stage"><svg class="cowboy" viewBox="0 0 170 220">${COWBOY}</svg></div>
    </div>
    <div class="hint"></div>`;
}
buildHalf($('h1')); buildHalf($('h2'));
$('posterCowboy').innerHTML = COWBOY;
$('posterCowboy').style.setProperty('--band','#a8402a');

/* ---------- state ---------- */
const P = [{el:$('h1'),score:0},{el:$('h2'),score:0}];
let state='menu', mode='pvp', target=3, round=0;
let timer=null, cpuT=null, nextT=null, overT=null, drawAt=0, lock=0, actx=null;
const finePointer = matchMedia('(hover:hover) and (pointer:fine)').matches;

/* ---------- storage ---------- */
function getBest(){ try{ return +localStorage.getItem('qd_best')||0 }catch(e){ return 0 } }
function setBest(t){ try{ const b=getBest(); if(!b||t<b) localStorage.setItem('qd_best',t) }catch(e){} }

/* ---------- audio ---------- */
function initAudio(){ try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); actx.resume(); }catch(e){} }
function tone(f,d,type='sine',v=.3,delay=0){
  if(!actx) return;
  const o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime+delay;
  o.type=type; o.frequency.value=f;
  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t+d);
}
function bang(){
  vib(60);
  if(!actx) return;
  const len=Math.floor(actx.sampleRate*.5), b=actx.createBuffer(1,len,actx.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,5);
  const s=actx.createBufferSource(), g=actx.createGain(), f=actx.createBiquadFilter();
  f.type='lowpass'; f.frequency.value=2500;
  s.buffer=b; g.gain.value=.9; s.connect(f).connect(g).connect(actx.destination); s.start();
  tone(70,.3,'sine',.5);
}
const bell = () => { tone(1320,.6,'triangle',.35); tone(1980,.4,'sine',.12); };
const tick = () => tone(220,.12,'square',.07);
const fanfare = () => [523,659,784,1047].forEach((f,i)=>tone(f,.35,'triangle',.18,i*.13));
function vib(p){ try{ navigator.vibrate && navigator.vibrate(p) }catch(e){} }

/* ---------- ui helpers ---------- */
function say(i,big,small=''){ const h=P[i].el; h.querySelector('.msg').textContent=big; h.querySelector('.sub').textContent=small; }
function setCls(i,c=''){ P[i].el.className='half '+c; }
function isCpu(i){ return mode==='cpu' && i===0; }
function renderScores(){
  P.forEach(p=>{
    let h=''; for(let k=0;k<target;k++) h+=`<span class="b${k<p.score?' on':''}"></span>`;
    p.el.querySelector('.bullets').innerHTML=h;
  });
}
function setHints(){
  P.forEach((p,i)=>{
    let h='';
    if(!isCpu(i)) h = finePointer ? (mode==='cpu' ? 'SPACE or click' : (i===0?'Key A or click':'Key L or click')) : 'Tap your side';
    p.el.querySelector('.hint').textContent=h;
  });
}
function clearTimers(){ [timer,cpuT,nextT,overT].forEach(clearTimeout); }

/* ---------- game flow ---------- */
function showMenu(){
  state='menu'; clearTimers();
  document.body.className=''; setCls(0); setCls(1);
  const b=getBest(); $('best').textContent = b ? 'Best reaction: '+b+' ms' : '';
  $('mid').style.display='none';
  $('menu').classList.remove('hidden');
}
function startMatch(m){
  mode=m; round=0; initAudio();
  P.forEach(p=>p.score=0);
  P[0].el.querySelector('.name').textContent = m==='cpu' ? 'Black Bart (CPU)' : 'Player 1';
  P[1].el.querySelector('.name').textContent = m==='cpu' ? 'You' : 'Player 2';
  $('menu').classList.add('hidden'); $('mid').style.display='';
  setHints(); renderScores(); startRound();
}
function startRound(){
  clearTimers();
  round++; $('roundTxt').textContent=round;
  state='wait'; document.body.className=''; setCls(0,'wait'); setCls(1,'wait');
  [0,1].forEach(i=>say(i,'Steady…','Hands off. Wait for DRAW!'));
  tick();
  lock = performance.now()+300;
  timer = setTimeout(fire, 1800 + Math.random()*3700);
}
function fire(){
  state='draw'; drawAt=performance.now();
  document.body.className='draw'; setCls(0); setCls(1);
  const fl=$('flash'); fl.classList.remove('go'); void fl.offsetWidth; fl.classList.add('go');
  [0,1].forEach(i=>say(i,'DRAW!'));
  bell();
  if(mode==='cpu') cpuT = setTimeout(()=>shoot(0), 175 + Math.random()*225);
}
function shoot(i){
  const now=performance.now();
  if(state==='wait'){
    if(now<lock) return;
    clearTimeout(timer); end(1-i, i, null);
  } else if(state==='draw'){
    end(i, 1-i, Math.round(now-drawAt));
  } else if(state==='over'){
    if(now>=lock) showMenu();
  }
}
function end(w,l,t){
  clearTimeout(cpuT);
  document.body.className='';
  P[w].score++; renderScores();
  setCls(w,'win'); setCls(l,'lose');
  bang();
  if(t===null){
    vib([30,40,30]);
    say(w,'Win!', (isCpu(l)?'Black Bart':'Opponent')+' drew too early');
    say(l,'Too early!','Foul — point to opponent');
  } else {
    if(!isCpu(w)) setBest(t);
    say(w, t+' ms', 'Fastest gun in town');
    say(l, 'Too slow', 'Beaten in '+t+' ms');
  }
  if(P[w].score>=target){
    state='over';
    lock = performance.now()+2200;
    overT = setTimeout(()=>{
      fanfare();
      say(w,'Champion!', (isCpu(w)?'Black Bart wins the duel':'You win the duel')+' · Tap for menu');
      say(l,'Defeated','Tap for menu');
    },1700);
  } else {
    state='result';
    overT = setTimeout(()=>{ if(state==='result') [0,1].forEach(i=>P[i].el.querySelector('.sub').textContent+=' · Next round…'); },1300);
    nextT = setTimeout(()=>{ if(state==='result') startRound(); },3000);
  }
}

/* ---------- input ---------- */
P.forEach((p,i)=>p.el.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(state==='menu') return;
  if(isCpu(i)){ if(state==='over') shoot(1); return; }
  shoot(i);
}));
document.addEventListener('keydown',e=>{
  if(e.repeat || state==='menu') return;
  const k=e.key.toLowerCase();
  if(mode==='cpu'){ if([' ','enter','a','l'].includes(k)){ e.preventDefault(); shoot(1); } }
  else { if(k==='a') shoot(0); else if(k==='l') shoot(1); }
});
document.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- menu ---------- */
document.querySelectorAll('.seg').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.seg').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); target=+b.dataset.t;
}));
$('b2p').addEventListener('click',()=>startMatch('pvp'));
$('bcpu').addEventListener('click',()=>startMatch('cpu'));
$('bfs').addEventListener('click',()=>{
  const d=document.documentElement;
  try{ (d.requestFullscreen||d.webkitRequestFullscreen).call(d); }catch(e){}
});

showMenu();
</script>
</body>
</html>
